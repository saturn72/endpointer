apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-master-data
  namespace: saturn72
  labels:
    app.kubernetes.io/part-of: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-volume-data
  namespace: saturn72
  labels:
    app.kubernetes.io/part-of: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-filer-data
  namespace: saturn72
  labels:
    app.kubernetes.io/part-of: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-master
  namespace: saturn72
  labels:
    app.kubernetes.io/component: master
    app.kubernetes.io/part-of: seaweedfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: master
    app.kubernetes.io/part-of: seaweedfs
  ports:
    - name: http
      port: 9333
      targetPort: http
    - name: grpc
      port: 19333
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: saturn72
  labels:
    app.kubernetes.io/component: filer
    app.kubernetes.io/part-of: seaweedfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: filer
    app.kubernetes.io/part-of: seaweedfs
  ports:
    - name: http
      port: 8888
      targetPort: http
    - name: grpc
      port: 18888
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: saturn72
  labels:
    app.kubernetes.io/component: s3
    app.kubernetes.io/part-of: seaweedfs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: s3
    app.kubernetes.io/part-of: seaweedfs
  ports:
    - name: http
      port: 8333
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-master
  namespace: saturn72
  labels:
    app.kubernetes.io/component: master
    app.kubernetes.io/part-of: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: master
      app.kubernetes.io/part-of: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: master
        app.kubernetes.io/part-of: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: master
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          args:
            - master
            - -mdir=/data
            - -ip=$(POD_IP)
            - -port=9333
            - -port.grpc=19333
            - -volumeSizeLimitMB=1024
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 9333
            - name: grpc
              containerPort: 19333
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-master-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-volume
  namespace: saturn72
  labels:
    app.kubernetes.io/component: volume
    app.kubernetes.io/part-of: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: volume
      app.kubernetes.io/part-of: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: volume
        app.kubernetes.io/part-of: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: volume
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          args:
            - volume
            - -mserver=seaweedfs-master:9333
            - -dir=/data
            - -max=20
            - -port=8080
            - -ip=$(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-volume-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-filer
  namespace: saturn72
  labels:
    app.kubernetes.io/component: filer
    app.kubernetes.io/part-of: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: filer
      app.kubernetes.io/part-of: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: filer
        app.kubernetes.io/part-of: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: filer
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          args:
            - filer
            - -master=seaweedfs-master:9333
            - -ip=$(POD_IP)
            - -port=8888
            - -port.grpc=18888
            - -defaultReplicaPlacement=000
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8888
            - name: grpc
              containerPort: 18888
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-filer-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-s3
  namespace: saturn72
  labels:
    app.kubernetes.io/component: s3
    app.kubernetes.io/part-of: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: s3
      app.kubernetes.io/part-of: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: s3
        app.kubernetes.io/part-of: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          args:
            - s3
            - -filer=seaweedfs-filer:8888
            - -port=8333
            - -config=/etc/seaweedfs/s3.json
          ports:
            - name: http
              containerPort: 8333
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: seaweedfs-s3-config
        - name: tmp
          emptyDir: {}