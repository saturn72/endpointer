apiVersion: v1
kind: ResourceQuota
metadata:
  name: saturn72-quota
  namespace: saturn72
spec:
  hard:
    pods: "4"
    persistentvolumeclaims: "3"
    requests.cpu: "500m"
    requests.memory: 1Gi
    requests.storage: 25Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: saturn72-limits
  namespace: saturn72
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: saturn72
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seaweedfs-internal-traffic
  namespace: saturn72
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: seaweedfs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: seaweedfs
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: seaweedfs
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-host-nginx-to-master-ui
  namespace: saturn72
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: master
      app.kubernetes.io/part-of: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 72.61.85.27/32
      ports:
        - protocol: TCP
          port: 9333